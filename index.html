<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <div class="main_container">
      <div class="input_container">
        <input id="inData" type="text" class="input_data" />  
      </div>
      <div class="container_button">
        <div class="number_button">
          <button  id="btn1" class="btn btn-1">1</button>
          <button id="btn2" class="btn2 btn-2">2</button>
          <button id="btn3" class="btn3 btn-3">3</button>
          <button id="btn4" class="btn4 btn-4">4</button>
          <button id="btn5" class="btn5 btn-5">5</button>
          <button id="btn6" class="btn6 btn-6">6</button>
          <button id="btn7" class="btn7 btn-7">7</button>
          <button id="btn8" class="btn8 btn-8">8</button>
          <button id="btn9" class="btn9 btn-9">9</button>
          <button id="btn0" class="btn0 btn-0">0</button>  
        </div>

        <div class="button_operation">
          <button id="btn-plus" class="btn">+</button>
          <button id="btn-min" class="btn">-</button>
          <button id="btn-cross" class="btn">x</button>
          <button id="btn-division" class="btn">/</button>
          <button id="btn-operate" class="btn">=</button>
        </div>
        
      </div>
    </div>
    <script src="calculadora.js"></script>
  </body>
</html>
