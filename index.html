<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <div class="main_container">
      <div class="input_container">
        <input id="inData" type="text" class="input_data" />  
      </div>
      <div class="container_button">
        <div class="number_button">
          <button  id="btn1" onclick="addData('1')" class="btn btn-1">1</button>
          <button id="btn2" onclick="addData('2')" class="btn2 btn-2">2</button>
          <button id="btn3" onclick="addData('3')" class="btn3 btn-3">3</button>
          <button id="btn4" onclick="addData('4')" class="btn4 btn-4">4</button>
          <button id="btn5" onclick="addData('5')" class="btn5 btn-5">5</button>
          <button id="btn6" onclick="addData('6')" class="btn6 btn-6">6</button>
          <button id="btn7" onclick="addData('7')" class="btn7 btn-7">7</button>
          <button id="btn8" onclick="addData('8')" class="btn8 btn-8">8</button>
          <button id="btn9" onclick="addData('9')" class="btn9 btn-9">9</button>
          <button id="btn0" onclick="addData('0')" class="btn0 btn-0">0</button>  
        </div>

        <div class="button_operation">
          <button id="btn-plus" onclick="addData('+')" class="btn">+</button>
          <button id="btn-min" onclick="addData('-')" class="btn">-</button>
          <button id="btn-cross" onclick="addData('x')" class="btn">x</button>
          <button id="btn-division" onclick="addData('/')" class="btn">/</button>
          <button id="btn-operate" class="btn">=</button>
        </div>
        
      </div>
    </div>
    <script src="calculadora.js"></script>
  </body>
</html>
